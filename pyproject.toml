[project]
name = "pbs-client"
dynamic = ["version"]
description = "Offline-first client and local mirror for the Australian PBS Public Data API v3"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Australian Cancer Data Network" }]
license = { text = "MIT" }
dependencies = [
  "oa-configurator>=1.2.1,<2.0.0",
  "orm-loader>=1.1.0,<2.0.0",
  "pydantic>=2.0,<3.0",
  "sqlalchemy>=2.0.45",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "ruff>=0.4",
  "ty>=0.0.59",
  "import-linter>=2.0",
]
notebooks = [
  "jupyterlab>=4.0",
  "ipykernel>=6.0",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "seaborn>=0.13",
]

[project.scripts]
pbs-client = "pbs_client.cli:main"

[project.entry-points."omop.config"]
pbs_client = "pbs_client.config:PBSClientConfig"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { tag_regex = '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$' }
fallback-version = "0.1.0"

[tool.hatch.build.targets.wheel]
packages = ["src/pbs_client"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
